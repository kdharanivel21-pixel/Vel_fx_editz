padding:0;

body{
background: var(--bg-color);
color: var(--text-color);
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:200%;
height:200%;
background:
radial-gradient(circle, rgba(0,255,255,0.08) 10%,transparent 10%),
radial-gradient(circle, rgba(255,0,255,0.08) 10%,transparent 10%);
background-size:120px 120px;
animation:bgMove 10s linear infinite;
z-index:-1;
}

@keyframes bgMove{
0%{ transform:translate(0,0); }
100%{ transform:translate(-120px,-120px); }
}

/* THEME TOGGLE FAB FLOATING BUTTON */
.theme-switcher-btn {
position: fixed;
top: 20px;
right: 20px;
z-index: 9999;
background: var(--primary-gradient);
border: 2px solid var(--text-color);
color: #fff;
padding: 12px 20px;
border-radius: 30px;
font-weight: bold;
cursor: pointer;
box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 10px var(--accent-color);
display: flex;
align-items: center;
gap: 8px;
font-size: 14px;
text-transform: uppercase;
letter-spacing: 1px;
}

.theme-switcher-btn:hover {
transform: scale(1.05);
box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 20px var(--hover-glow);
}

.theme-switcher-btn:active {
transform: scale(0.95);
}

header{
padding:40px 20px;
text-align:center;

height:220px;

0 0 20px var(--accent-color),

100%{ transform:translateY(0); }

header h1{
font-size:48px;

}

header p{
margin-top:10px;
font-size:20px;
margin-bottom:25px;
}

justify-content: center;
gap: 20px;
flex-wrap: wrap;
margin-bottom: 10px;

font-weight:bold;

animation:pulse 2s infinite;

.follow-btn:hover{

background:#1877f2;
box-shadow: 0 0 25px #0095f6;
}

.insta-icon {
width: 24px;
height: 24px;
fill: white;
}

.tg-btn {
display: inline-flex;
align-items: center;
gap: 10px;
padding: 14px 32px;
background: #24A1DE;
color: white;
text-decoration: none;
font-size: 18px;
font-weight: bold;

animation: pulse 2s infinite 0.5s;
}

.tg-btn:hover {
transform: scale(1.08);
background: #1d84b5;
box-shadow: 0 0 25px #24A1DE;
}

.tg-icon {
width: 24px;
height: 24px;

}

@keyframes pulse{
0%{ transform:scale(1); }
50%{ transform:scale(1.05); }
100%{ transform:scale(1); }

.search-box{
display:flex;
justify-content:center;
margin:40px 20px 20px 20px;
}

.search-box input{
width:300px;
padding:15px;

outline:none;
font-size:18px;

color: white;
box-shadow: 0 0 15px var(--hover-glow);

.tab-container {
display: flex;
justify-content: center;
align-items: center;
gap: 12px;
flex-wrap: wrap;
margin: 25px auto 35px auto;
padding: 0 20px;

border: 2px solid var(--accent-color);

font-size: 15px;
font-weight: bold;

.tab-btn.active {
background: var(--primary-gradient);
color: #ffffff;
border-color: transparent;
box-shadow: 0 0 20px var(--hover-glow);

.section-title{

font-size:40px;
margin-top:40px;
margin-bottom:30px;
color: var(--accent-color);
text-shadow:0 0 20px var(--box-shadow-color);
}

/* CARD AREA */
.card-area{
display: grid;
grid-template-columns: repeat(auto-fit, minmax(320px, max-content));
justify-content: center;
gap:30px;
padding:20px;
width: 100%;
}

/* CARD */
.card{
width:320px;
background: var(--card-bg);
border-radius:20px;
overflow:hidden;
box-shadow:0 0 25px var(--card-shadow-color);
transition:0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
animation:fadeUp 1s ease;
display: flex;
flex-direction: column;
border: 1px solid rgba(255,255,255,0.05);
}

@keyframes fadeUp{
from{ opacity:0; transform:translateY(50px); }
to{ opacity:1; transform:translateY(0); }
}

.card:hover{
transform:translateY(-10px) scale(1.04);
box-shadow:0 0 35px var(--card-hover-shadow);
}

.card img{
width:100%;
aspect-ratio: 3 / 4;
object-fit:cover;
border-bottom:3px solid var(--accent-color);
object-position: center top;
}

.card-content{
padding:20px;
text-align:center;
display: flex;
flex-direction: column;
flex-grow: 1;
justify-content: space-between;

font-size:28px;
color: var(--accent-color);
margin-bottom:10px;

.card-content p{
font-size:18px;

margin-bottom:20px;

font-size:16px;
font-weight:bold;

.copy-btn:hover{

  prompt: `Warm-toned cinematic 3-frame portrait collage of a beautiful South Asian woman in elegant traditional attire. She has long loose black hair, gold jhumka earrings, delicate bangles, and intricate mehendi on her hands. Soft golden-hour lighting, creamy bokeh, shallow depth of field, editorial fashion style, ultra-realistic, DSLR, 85mm, f/1.8, 8K. Frame 1 (Top): She gently adjusts her gold jhumka with her mehendi-covered hand, head slightly turned away, soft hair framing her face, creating a natural candid moment with a warm cinematic glow`
},
      
  
    ];

/* ENGINE LOGIC */
function displayVideos(list){
const results = document.getElementById("videoResults");
results.innerHTML = "";
list.forEach(video => {
results.innerHTML += `
<div class="card">
<img src="${video.thumbnail}">
<div class="card-content">
<h2>${video.code}</h2>
<p>${video.title}</p>
<a class="open-btn" href="${video.link}" target="_blank">OPEN PROJECT</a>
</div>
</div>
`;
});
}

function displayPrompts(list, targetElementId){
const results = document.getElementById(targetElementId);
results.innerHTML = "";
list.forEach(prompt => {
results.innerHTML += `
<div class="card">
<img src="${prompt.thumbnail}">
<div class="card-content">
<h2>${prompt.code}</h2>
<p>${prompt.title}</p>
<textarea id="${prompt.code}" class="prompt-box" readonly>${prompt.prompt}</textarea>
<button class="copy-btn" onclick="copyPrompt('${prompt.code}')">COPY PROMPT</button>
</div>
</div>
`;
});
}

function refreshAllSections(videoSrc, bothSrc, boySrc, girlSrc) {
displayVideos(videoSrc);
displayPrompts(bothSrc, "bothPromptResults");
displayPrompts(boySrc, "boyPromptResults");
displayPrompts(girlSrc, "girlPromptResults");
}

/* SWITCH CATEGORY TAB CONTROLLER */
function switchCategory(sectionId, btnElement) {
  // Reset search box when changing tabs
  document.getElementById("searchInput").value = "";
  refreshAllSections(videos, bothPrompts, boyPrompts, girlPrompts);

  // Update active state on tab buttons
  const buttons = document.querySelectorAll('.tab-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');

  // Toggle visible sections based on tab
  const sections = document.querySelectorAll('.category-section');
  if(sectionId === 'allSection') {
    sections.forEach(sec => sec.style.display = 'block');
  } else {
    sections.forEach(sec => sec.style.display = 'none');
    const activeSec = document.getElementById(sectionId);
    if(activeSec) activeSec.style.display = 'block';
  }
}

function searchItems(){
let input = document.getElementById("searchInput").value.toUpperCase();
if(input === ""){
refreshAllSections(videos, bothPrompts, boyPrompts, girlPrompts);
return;
}
const filteredVideos = videos.filter(v => v.code.toUpperCase().includes(input) || v.title.toUpperCase().includes(input));
const filteredBoth = bothPrompts.filter(p => p.code.toUpperCase().includes(input) || p.title.toUpperCase().includes(input));
const filteredBoys = boyPrompts.filter(p => p.code.toUpperCase().includes(input) || p.title.toUpperCase().includes(input));
const filteredGirls = girlPrompts.filter(p => p.code.toUpperCase().includes(input) || p.title.toUpperCase().includes(input));
refreshAllSections(filteredVideos, filteredBoth, filteredBoys, filteredGirls);
}

function copyPrompt(id){
const text = document.getElementById(id);
navigator.clipboard.writeText(text.value);
alert("Prompt Copied!");
}

/* INTERACTIVE DYNAMIC COLOR THEME CONTROLLER ENGINE */
const themesList = ["cyberpunk", "royal", "emerald", "crimson"];
let currentThemeIndex = 0;

function toggleTheme() {
  currentThemeIndex = (currentThemeIndex + 1) % themesList.length;
  const activeTheme = themesList[currentThemeIndex];
  
  if (activeTheme === "cyberpunk") {
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", activeTheme);
  }
}

// Initialize Render Call
refreshAllSections(videos, bothPrompts, boyPrompts, girlPrompts);
</script>
